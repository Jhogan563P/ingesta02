version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mi_base
      MYSQL_USER: mi_usuario
      MYSQL_PASSWORD: mi_contraseña
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10
      start_period: 40s
      interval: 10s
    
  ingesta:
    build: .
    container_name: ingesta-app
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure:5
    volumes:
      - /home/ubuntu/.aws/credentials:/root/.aws/credentials
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: mi_usuario
      MYSQL_PASSWORD: mi_contraseña
      MYSQL_DATABASE: mi_base
      MYSQL_PORT: 3306

volumes:
  mysql_data: